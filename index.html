<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薑餅人放置大戰爭 - 陣容助手</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f9; }
        .section { background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin-bottom: 8px; box-sizing: border-box; }
        button { padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; width: 100%; cursor: pointer; }
        .btn-del { background: #f44336; margin-top: 5px; }
        .item-card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .item-card img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .slot { margin: 10px 0; display: flex; align-items: center; }
        .slot select { margin-left: 10px; flex: 1; }
        dialog { width: 90%; border: none; border-radius: 10px; padding: 20px; }
    </style>
</head>
<body>

<!-- 圖鑑管理區 -->
<div class="section">
    <h2>🛠️ 圖鑑管理</h2>
    <input type="text" id="itemName" placeholder="名稱">
    <select id="itemType"><option value="cookie">餅乾</option><option value="pet">寵物</option></select>
    <select id="itemRarity">
        <option value="5">SSR</option><option value="4">SR</option>
        <option value="3">R</option><option value="2">N</option><option value="1">C</option>
    </select>
    <input type="file" id="itemImg" accept="image/*">
    <button onclick="saveItem()">新增項目</button>
</div>

<!-- 陣容搭配區 -->
<div class="section">
    <h2>⚔️ 陣容搭配</h2>
    <input type="text" id="teamName" placeholder="陣容名稱">
    <h3>🍪 餅乾 (10位)</h3>
    <div id="cookieSlots"></div>
    <h3>🐾 寵物 (3位)</h3>
    <div id="petSlots"></div>
</div>

<!-- 列表區 -->
<div class="section">
    <select id="sortOrder" onchange="renderAll()">
        <option value="none">預設排序</option>
        <option value="high-low">稀有度 高 → 低</option>
        <option value="low-high">稀有度 低 → 高</option>
    </select>
    <div id="libraryList"></div>
</div>

<dialog id="editDialog">
    <h3>編輯項目</h3>
    <input type="text" id="editName">
    <select id="editRarity">
        <option value="5">SSR</option><option value="4">SR</option>
        <option value="3">R</option><option value="2">N</option><option value="1">C</option>
    </select>
    <input type="file" id="editImg" accept="image/*">
    <button onclick="confirmEdit()">儲存修改</button>
    <button onclick="document.getElementById('editDialog').close()" style="background:#888; margin-top:5px;">取消</button>
</dialog>

<script>
    let db = JSON.parse(localStorage.getItem('myDB')) || [];
    let editId = null;

    async function saveItem() {
        const name = document.getElementById('itemName').value;
        const type = document.getElementById('itemType').value;
        const rarity = parseInt(document.getElementById('itemRarity').value);
        const file = document.getElementById('itemImg').files[0];
        if (!name) return alert("請輸入名稱");
        let img = 'https://via.placeholder.com/50';
        if (file) img = await new Promise(r => { const f = new FileReader(); f.onload = e => r(e.target.result); f.readAsDataURL(file); });
        db.push({ id: Date.now(), name, type, rarity, img });
        localStorage.setItem('myDB', JSON.stringify(db));
        renderAll();
    }

    function renderAll() {
        const order = document.getElementById('sortOrder').value;
        let list = [...db];
        if (order === 'high-low') list.sort((a, b) => b.rarity - a.rarity);
        if (order === 'low-high') list.sort((a, b) => a.rarity - b.rarity);

        const rarityMap = ['','C','N','R','SR','SSR'];
        const container = document.getElementById('libraryList');
        container.innerHTML = list.map(i => `
            <div class="item-card">
                <img src="${i.img}">
                <div style="flex:1"><b>${i.name} (${rarityMap[i.rarity]})</b><br>
                    <button onclick="openEdit(${i.id})">編輯</button>
                    <button class="btn-del" onclick="handleDelete(${i.id})">刪除</button>
                </div>
            </div>`).join('');
        renderSlots();
    }

    function renderSlots() {
        const cookies = db.filter(i => i.type === 'cookie');
        const pets = db.filter(i => i.type === 'pet');
        const create = (list, contId, count, cls) => {
            const cont = document.getElementById(contId);
            cont.innerHTML = '';
            for(let i=0; i<count; i++) {
                cont.innerHTML += `<div class="slot">位置${i+1} <select class="${cls}">
                    <option value="">--選擇--</option>${list.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}
                </select></div>`;
            }
        };
        create(cookies, 'cookieSlots', 10, 'cookie-sel');
        create(pets, 'petSlots', 3, 'pet-sel');
        // 綁定防重複邏輯
        document.querySelectorAll('select').forEach(s => s.addEventListener('change', checkDuplicate));
    }

    function checkDuplicate() {
        const selects = document.querySelectorAll('select');
        const selected = Array.from(selects).map(s => s.value).filter(v => v !== "");
        selects.forEach(s => {
            Array.from(s.options).forEach(o => {
                if(o.value && o.value !== s.value && selected.includes(o.value)) o.disabled = true;
                else o.disabled = false;
            });
        });
    }

    function openEdit(id) {
        const item = db.find(x => x.id == id);
        editId = id;
        document.getElementById('editName').value = item.name;
        document.getElementById('editRarity').value = item.rarity;
        document.getElementById('editDialog').showModal();
    }

    async function confirmEdit() {
        const idx = db.findIndex(i => i.id == editId);
        db[idx].name = document.getElementById('editName').value;
        db[idx].rarity = parseInt(document.getElementById('editRarity').value);
        const file = document.getElementById('editImg').files[0];
        if (file) db[idx].img = await new Promise(r => { const f = new FileReader(); f.onload = e => r(e.target.result); f.readAsDataURL(file); });
        localStorage.setItem('myDB', JSON.stringify(db));
        document.getElementById('editDialog').close();
        renderAll();
    }

    window.handleDelete = (id) => {
        if(!confirm("確定刪除？")) return;
        db = db.filter(i => i.id != id);
        localStorage.setItem('myDB', JSON.stringify(db));
        renderAll();
    };

    renderAll();
</script>
</body>
</html>
