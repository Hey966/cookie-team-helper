<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薑餅人 - 陣容助手</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f9; }
        .page { display: none; }
        .page.active { display: block; }
        .section { background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-btn { height: 80px; font-size: 18px; margin-bottom: 10px; background: #4CAF50; color: white; border: none; border-radius: 10px; width: 100%; cursor: pointer; }
        .slot { margin: 8px 0; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .slot img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; display: none; }
        select, input[type="text"], input[type="file"], textarea { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; width: 100%; cursor: pointer; margin-top: 5px; }
        .btn-del { background: #f44336; }
        .btn-sm { width: auto; padding: 5px 10px; font-size: 12px; }
        .item-card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; background: #fff; }
        .item-card img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        dialog { width: 90%; border: none; border-radius: 10px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
        .storage-status { text-align: center; font-size: 14px; margin-top: 15px; color: #666; font-weight: bold; }
        .list-header { margin: 15px 0 10px 0; color: #444; font-size: 16px; border-bottom: 2px solid #ddd; padding-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>

<!-- 首頁導航 -->
<div id="page-home" class="page active">
    <h1 style="text-align: center; color: #333;">薑餅人陣容助手</h1>
    <button class="menu-btn" onclick="showPage('page-library')">🛠️ 圖鑑管理</button>
    <button class="menu-btn" onclick="showPage('page-team')">⚔️ 陣容搭配</button>
    <button class="menu-btn" style="background:#2196F3" onclick="showPage('page-backup')">🛡️ 資料備份與還原</button>
    <div class="storage-status"></div>
</div>

<!-- 圖鑑管理 -->
<div id="page-library" class="page">
    <button onclick="showPage('page-home')" style="background:#888; margin-bottom: 15px;">⬅️ 返回首頁</button>
    <h2>新增圖鑑</h2>
    <div class="section">
        <input type="text" id="itemName" placeholder="名稱">
        <select id="itemType"><option value="cookie">餅乾</option><option value="pet">寵物</option></select>
        <select id="itemRarity">
            <option value="6">TSSR</option><option value="5">SSR</option><option value="4">SR</option>
            <option value="3">R</option><option value="2">U</option><option value="1">C</option>
        </select>
        <input type="file" id="itemImg" accept="image/*">
        <button onclick="saveItem()">新增項目</button>
    </div>
    
    <div class="section">
        <h3 style="margin-top: 0;">圖鑑列表 <span style="font-size: 14px; color: #666; font-weight: normal;">(餅乾: <span id="cookieCount">0</span> / 寵物: <span id="petCount">0</span>)</span></h3>
        <select id="sortOrder" onchange="renderAll()">
            <option value="high-low">稀有度 高 → 低 (預設)</option>
            <option value="low-high">稀有度 低 → 高</option>
        </select>
        <div id="libraryList"></div>
    </div>
</div>

<!-- 陣容搭配 -->
<div id="page-team" class="page">
    <button onclick="showPage('page-home')" style="background:#888; margin-bottom: 15px;">⬅️ 返回首頁</button>
    <h2>陣容搭配</h2>

    <div class="section" style="background: #e3f2fd;">
        <h3 style="margin-top: 0;">💾 陣容存檔</h3>
        <input type="text" id="teamName" placeholder="輸入陣容名稱 (例如: 公會戰一隊)">
        <button onclick="saveTeam()" style="background: #2196F3;">儲存當前陣容</button>
        <hr style="margin: 15px 0; border: 0.5px solid #bbb;">
        <select id="savedTeamsList" onchange="loadTeam()">
            <option value="">-- 讀取已儲存的陣容 --</option>
        </select>
        <button onclick="deleteTeam()" class="btn-del">刪除所選陣容</button>
    </div>

    <div class="section">
        <h3>🍪 餅乾 (10位)</h3><div id="cookieSlots"></div>
        <hr style="margin: 20px 0; border: 0.5px solid #eee;">
        <h3>🐾 寵物 (3位)</h3><div id="petSlots"></div>
    </div>
</div>

<!-- 資料備份 (檔案版) -->
<div id="page-backup" class="page">
    <button onclick="showPage('page-home')" style="background:#888; margin-bottom: 15px;">⬅️ 返回首頁</button>
    <h2>資料備份 (檔案模式)</h2>
    <div class="section">
        <h3 style="margin-top: 0; font-size: 16px;">匯出資料</h3>
        <p style="font-size: 12px; color: #666;">將目前的圖鑑與陣容打包成檔案下載到手機中。</p>
        <button onclick="exportFile()" style="background:#2196F3">⬇️ 下載備份檔案 (.json)</button>
        
        <hr style="margin: 20px 0; border: 0.5px solid #eee;">
        
        <h3 style="margin-top: 0; font-size: 16px;">匯入資料</h3>
        <p style="font-size: 12px; color: #666;">選擇之前下載的 .json 備份檔案來還原資料。</p>
        <input type="file" id="backupFileInput" accept=".json" style="margin-bottom: 10px;">
        <button onclick="importFile()" class="btn-del">🔄 讀取檔案並還原</button>
        
        <div class="storage-status"></div>
    </div>
</div>

<!-- 編輯視窗 -->
<dialog id="editDialog">
    <h3>編輯項目</h3>
    <label style="font-size: 14px; color: #555;">名稱</label>
    <input type="text" id="editName">
    <label style="font-size: 14px; color: #555;">稀有度</label>
    <select id="editRarity">
        <option value="6">TSSR</option><option value="5">SSR</option><option value="4">SR</option>
        <option value="3">R</option><option value="2">U</option><option value="1">C</option>
    </select>
    <label style="font-size: 14px; color: #555;">更改圖片 (不選則保留原圖)</label>
    <input type="file" id="editImg" accept="image/*">
    <button onclick="confirmEdit()" style="margin-top: 15px;">儲存修改</button>
    <button onclick="document.getElementById('editDialog').close()" style="background:#888; margin-top:5px;">取消</button>
</dialog>

<script>
    let db = JSON.parse(localStorage.getItem('myDB')) || [];
    let teamsDB = JSON.parse(localStorage.getItem('myTeams')) || []; 
    let editId = null;
    const rarityMap = ['','C','U','R','SR','SSR','TSSR'];

    function showPage(p) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.getElementById(p).classList.add('active');
        renderAll();
    }

    function updateStorageInfo() {
        let totalBytes = 0;
        for (let key in localStorage) {
            if (localStorage.hasOwnProperty(key)) {
                totalBytes += (localStorage[key].length + key.length) * 2;
            }
        }
        let kb = (totalBytes / 1024).toFixed(1);
        document.querySelectorAll('.storage-status').forEach(el => {
            el.innerHTML = `💾 空間使用: ${kb} KB / 5120 KB (約5MB)`;
            if (totalBytes > 4 * 1024 * 1024) el.style.color = '#f44336';
            else el.style.color = '#666';
        });
    }

    function resizeImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > 150) { height = Math.round((height * 150) / width); width = 150; }
                    } else {
                        if (height > 150) { width = Math.round((width * 150) / height); height = 150; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function saveItem() {
        const nameInput = document.getElementById('itemName');
        const typeInput = document.getElementById('itemType');
        const rarityInput = document.getElementById('itemRarity');
        const fileInput = document.getElementById('itemImg');
        
        if (!nameInput.value) return alert("請輸入名稱");
        let img = 'https://via.placeholder.com/50';
        if (fileInput.files[0]) img = await resizeImage(fileInput.files[0]);
        
        db.push({ id: Date.now(), name: nameInput.value, type: typeInput.value, rarity: parseInt(rarityInput.value), img });
        
        try {
            localStorage.setItem('myDB', JSON.stringify(db));
        } catch (e) {
            db.pop(); alert("⚠️ 儲存空間已滿！"); return;
        }
        
        nameInput.value = ''; fileInput.value = ''; rarityInput.value = '6';
        renderAll();
    }

    function renderAll() {
        const order = document.getElementById('sortOrder').value || 'high-low';
        let cookies = db.filter(i => i.type === 'cookie');
        let pets = db.filter(i => i.type === 'pet');
        
        const sortFunc = (a, b) => order === 'high-low' ? b.rarity - a.rarity : a.rarity - b.rarity;
        cookies.sort(sortFunc); pets.sort(sortFunc);

        document.getElementById('cookieCount').innerText = cookies.length;
        document.getElementById('petCount').innerText = pets.length;

        const generateCards = (list) => list.map(i => `
            <div class="item-card"><img src="${i.img}"><div style="flex:1">
                <b>${i.name} (${rarityMap[i.rarity]})</b><br>
                <button class="btn-sm" style="background:#2196F3;" onclick="openEdit(${i.id})">編輯</button>
                <button class="btn-sm btn-del" onclick="handleDelete(${i.id})">刪除</button>
            </div></div>`).join('');

        let listHtml = '';
        if (cookies.length > 0) listHtml += `<div class="list-header">🍪 餅乾區</div>` + generateCards(cookies);
        if (pets.length > 0) listHtml += `<div class="list-header">🐾 寵物區</div>` + generateCards(pets);
        if (!listHtml) listHtml = `<div style="text-align:center; color:#999; margin-top:20px;">尚無資料。</div>`;
        document.getElementById('libraryList').innerHTML = listHtml;
        
        renderSlots('cookieSlots', cookies, 10, 'sel-cookie');
        renderSlots('petSlots', pets, 3, 'sel-pet');
        renderTeamsDropdown(); 
        updateStorageInfo();
    }

    function renderSlots(id, list, count, cls) {
        const cont = document.getElementById(id);
        cont.innerHTML = '';
        const sortedList = [...list].sort((a, b) => b.rarity - a.rarity); 
        for(let i=0; i<count; i++) {
            cont.innerHTML += `<div class="slot"><span style="min-width:20px;">${i+1}</span>
                <select class="${cls}" onchange="updateImage(this); checkDuplicates('${cls}')">
                    <option value="">--選擇--</option>
                    ${sortedList.map(x=>`<option value="${x.id}">${x.name} (${rarityMap[x.rarity]})</option>`).join('')}
                </select><img src="" alt="預覽圖"></div>`;
        }
    }

    function checkDuplicates(cls) {
        const selects = document.querySelectorAll('.' + cls);
        const selected = Array.from(selects).map(s => s.value).filter(v => v !== "");
        selects.forEach(s => {
            Array.from(s.options).forEach(o => { 
                o.disabled = (o.value !== "" && o.value !== s.value && selected.includes(o.value)); 
            });
        });
    }

    function updateImage(s) {
        const img = s.nextElementSibling;
        const item = db.find(x => x.id == s.value);
        if(item) { img.src = item.img; img.style.display = 'block'; } else img.style.display = 'none';
    }

    function saveTeam() {
        const tName = document.getElementById('teamName').value.trim();
        if(!tName) return alert('請輸入陣容名稱！');

        const cookies = Array.from(document.querySelectorAll('.sel-cookie')).map(s => s.value);
        const pets = Array.from(document.querySelectorAll('.sel-pet')).map(s => s.value);

        const existingIdx = teamsDB.findIndex(t => t.name === tName);
        if (existingIdx > -1) {
            if (confirm(`名稱為「${tName}」的陣容已存在，要覆蓋它嗎？`)) {
                teamsDB[existingIdx].cookies = cookies;
                teamsDB[existingIdx].pets = pets;
            } else return;
        } else {
            teamsDB.push({ id: Date.now(), name: tName, cookies, pets });
        }
        
        localStorage.setItem('myTeams', JSON.stringify(teamsDB));
        alert('陣容儲存成功！');
        renderTeamsDropdown();
    }

    function renderTeamsDropdown() {
        const select = document.getElementById('savedTeamsList');
        if (!select) return;
        select.innerHTML = '<option value="">-- 讀取已儲存的陣容 --</option>' + 
                           teamsDB.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    }

    function loadTeam() {
        const tId = document.getElementById('savedTeamsList').value;
        if (!tId) return;

        const team = teamsDB.find(t => t.id == tId);
        if (!team) return;

        document.getElementById('teamName').value = team.name;

        const cookieSelects = document.querySelectorAll('.sel-cookie');
        team.cookies.forEach((val, idx) => {
            if (cookieSelects[idx]) {
                cookieSelects[idx].value = val || "";
                updateImage(cookieSelects[idx]);
            }
        });

        const petSelects = document.querySelectorAll('.sel-pet');
        team.pets.forEach((val, idx) => {
            if (petSelects[idx]) {
                petSelects[idx].value = val || "";
                updateImage(petSelects[idx]);
            }
        });

        checkDuplicates('sel-cookie');
        checkDuplicates('sel-pet');
    }

    function deleteTeam() {
        const tId = document.getElementById('savedTeamsList').value;
        if (!tId) return alert('請先從下拉選單選擇一個陣容');

        const team = teamsDB.find(t => t.id == tId);
        if (confirm(`確定要刪除陣容「${team.name}」嗎？`)) {
            teamsDB = teamsDB.filter(t => t.id != tId);
            localStorage.setItem('myTeams', JSON.stringify(teamsDB));
            document.getElementById('teamName').value = '';
            renderTeamsDropdown();
        }
    }

    function openEdit(id) {
        const item = db.find(x => x.id == id);
        editId = id;
        document.getElementById('editName').value = item.name;
        document.getElementById('editRarity').value = item.rarity;
        document.getElementById('editImg').value = ''; 
        document.getElementById('editDialog').showModal();
    }

    async function confirmEdit() {
        const idx = db.findIndex(i => i.id == editId);
        db[idx].name = document.getElementById('editName').value;
        db[idx].rarity = parseInt(document.getElementById('editRarity').value);
        const f = document.getElementById('editImg').files[0];
        if (f) db[idx].img = await resizeImage(f); 
        try { localStorage.setItem('myDB', JSON.stringify(db)); document.getElementById('editDialog').close(); renderAll(); } 
        catch (e) { alert("⚠️ 儲存空間已滿！"); }
    }

    window.handleDelete = (id) => {
        if(confirm("確定刪除？(若陣容中有用到此餅乾，下次讀取時該欄位會變為空)")) { 
            db = db.filter(i => i.id != id); localStorage.setItem('myDB', JSON.stringify(db)); renderAll(); 
        }
    };

    // 🌟 新版檔案備份：匯出為 JSON 檔案
    function exportFile() {
        const backupData = { items: db, teams: teamsDB };
        const jsonString = JSON.stringify(backupData);
        const blob = new Blob([jsonString], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        
        // 建立時間戳記檔名
        const d = new Date();
        const timeStr = `${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}_${d.getHours().toString().padStart(2,'0')}${d.getMinutes().toString().padStart(2,'0')}`;
        a.download = `cookie_backup_${timeStr}.json`;
        
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
    
    // 🌟 新版檔案備份：從 JSON 檔案匯入
    function importFile() {
        const fileInput = document.getElementById('backupFileInput');
        const file = fileInput.files[0];
        
        if (!file) return alert("請先選擇備份檔案 (.json)");
        
        if (confirm("這將會覆蓋現有的所有圖鑑與陣容資料，確定要還原嗎？")) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    
                    if (Array.isArray(parsed)) {
                        db = parsed;
                        teamsDB = []; 
                    } else {
                        db = parsed.items || [];
                        teamsDB = parsed.teams || [];
                    }
                    
                    localStorage.setItem('myDB', JSON.stringify(db)); 
                    localStorage.setItem('myTeams', JSON.stringify(teamsDB)); 
                    renderAll(); 
                    alert("資料還原成功！");
                    fileInput.value = ''; // 清空選擇的檔案
                } catch (err) {
                    alert("檔案格式錯誤或損毀！");
                }
            };
            reader.readAsText(file);
        }
    }

    renderAll();
</script>
</body>
</html>
